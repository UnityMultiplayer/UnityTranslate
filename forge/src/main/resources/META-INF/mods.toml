modLoader = "klf"
loaderVersion = "[${kotlinlangforge_loader},)"
license = "MIT"
issueTrackerURL = "https://github.com/BluSpring/UnityTranslate/issues"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    logoFile = "icon.png"
    credits = "Thanks to Argos Open Tech for creating Argos Translate, without it this mod would not have been possible."
    authors = "${mod_authors}"
    description = '''
    ${mod_description}
    '''

[[dependencies.${mod_id}]]
    modId = "forge"
    mandatory = true
    versionRange = "[${forge_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "klf"
    mandatory = true
    versionRange = "[${kotlinlangforge_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "modernnetworking"
    mandatory = true
    versionRange = "[${modernnetworking_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "talk_balloons"
    mandatory = false
    versionRange = "[1.2.0,)"
    ordering = "NONE"
    side = "BOTH"

[[mixins]]
    config = "unitytranslate.mixins.json"