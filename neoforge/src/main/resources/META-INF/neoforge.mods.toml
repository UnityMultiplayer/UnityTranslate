modLoader = "kfl"
loaderVersion = "[${kotlinlangforge_loader},)"
license = "MIT"
issueTrackerURL = "https://github.com/UnityMultiplayer/UnityTranslate/issues"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName="${mod_name}"
    logoFile = "icon.png"
    credits = "Thanks to Argos Open Tech for creating Argos Translate, without it this mod would not have been possible."
    authors = "${mod_authors}"
    description = '''
    ${mod_description}
    '''

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neoforge_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "klf"
    type = "required"
    versionRange = "[${kotlinlangforge_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId = "modernnetworking"
    type = "required"
    versionRange = "[${modernnetworking_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId = "talk_balloons"
    type = "optional"
    versionRange = "[1.2.0,)"
    ordering = "NONE"
    side = "BOTH"

[[mixins]]
    config = "unitytranslate.mixins.json"